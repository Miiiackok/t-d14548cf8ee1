<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>我的旅行日历</title>
  <style>
    :root{--paper:#f8f6ee;--ink:#26352d;--soft:#59655b;--line:#dddcd0;--sheet:#fdfcf7;--marker:#c6ef5c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
    main{width:min(100% - 36px,850px);margin:45px auto 36px}
    h1,h2,p{margin:0}
    h1{font:700 clamp(31px,6vw,48px)/1.15 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.035em}
    .intro{margin-top:11px;color:var(--soft)}
    .calendar{margin-top:27px;background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .month{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px}
    .month h2{font-size:21px;font-variant-numeric:tabular-nums}
    button,a{color:inherit}
    .month button{background:transparent;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}
    .month button:hover{background:#efeee5}
    .weekdays,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .weekdays span{text-align:center;color:var(--soft);font-size:13px;padding:7px 0}
    .week{position:relative;border-top:1px solid var(--line);min-height:var(--row-height,82px)}
    .day{min-width:0;padding:7px 10px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
    .day:nth-child(7){border-right:0}
    .overflow-day{color:#656c60;background:#f6f5ee}
    .mark{position:absolute;left:calc(100% / 7 * var(--start) + 3px);width:calc(100% / 7 * var(--length) - 6px);top:calc(27px + var(--lane) * 33px);height:34px;display:flex;align-items:center;padding:0 7px;isolation:isolate;text-decoration:none;white-space:nowrap;color:#202b18;font-size:13px;font-weight:700}
    .mark::before{content:"";position:absolute;z-index:-1;inset:9px 0 6px;background:var(--trip-color);clip-path:polygon(1% 9%,99% 0,100% 38%,99% 95%,2% 100%,0 60%)}
    .mark:hover::before{inset:6px 0 4px;filter:saturate(1.25)}
    .mark:focus-visible,.month button:focus-visible,.trip:focus-visible{outline:2px solid #426036;outline-offset:2px}
    .trips{display:grid;gap:8px;margin-top:21px}
    .trip{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-decoration:none}
    .trip:hover{border-color:#8e9982}
    .trip strong{flex:1}
    .trip span{color:var(--soft);font-variant-numeric:tabular-nums}
    .swatch{width:17px;height:8px;border-radius:2px;background:var(--trip-color)}
    @media(max-width:520px){main{width:calc(100% - 24px);margin-top:27px}.calendar{margin-top:21px}.month{padding:10px}.day{padding:6px;font-size:13px}.week{min-height:var(--mobile-row-height,64px)}}
  
    [hidden]{display:none!important}
    .auth{margin-top:20px;width:min(100%,470px);padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
    .auth label{display:block;margin:12px 0 3px}
    .auth input{width:100%;min-height:44px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
    .actions button,.actions label{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--sheet);border-radius:7px;font:inherit;cursor:pointer}
    .actions button:first-child{background:var(--marker)}
    .account-actions{justify-content:flex-end}
    .place-options{list-style:none;margin:3px 0 8px;padding:0;max-height:168px;overflow:auto;border:1px solid var(--line);border-radius:8px}
    .place-options li{cursor:pointer;padding:8px 10px;border-bottom:1px solid var(--line)}
    .place-options li:last-child{border-bottom:0}
    .place-options li:hover,.place-options li[aria-selected=true]{background:#e9efda}
    .place-options small{margin-left:8px;font-size:12px;color:var(--soft)}
    #trip-city[readonly]{background:#f0efe8}
    #app-message{margin-top:10px;color:var(--soft)}
    .share-dialog{width:min(calc(100% - 30px),500px);padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink)}
    .share-dialog::backdrop{background:#26352d88}
    .share-head{display:flex;justify-content:space-between;align-items:center}
    .share-head button,#active-shares button{min-height:44px;padding:0 10px;background:transparent;border:1px solid var(--line);border-radius:7px;font:inherit}
    .share-scope{margin:8px 0 14px;color:var(--soft);font-size:14px}
    .share-dialog fieldset{display:grid;gap:6px;border:1px solid var(--line);border-radius:7px;margin:0 0 10px;padding:8px}
    .share-dialog label:not(.share-recipient){min-height:36px}
    .share-dialog input:not([type=radio]){width:100%;min-height:42px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font:inherit}
    #active-shares{list-style:none;padding:0}
    #active-shares li{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;overflow-wrap:anywhere}
    .attribution{font-size:12px;color:var(--soft)}
    .trips:empty{display:none}
  
  .drawing-tools{margin-top:14px}
  .tool-row,.pen-palette{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .tool-row button,.pending-marker button,.share-button{min-height:44px;padding:0 14px;background:var(--sheet);border:1px solid var(--line);border-radius:9px;color:var(--ink);cursor:pointer;font:inherit}
  .tool-row .active{border-color:#667b42;background:#eaf0d8}
  .tool-circle{display:inline-block;width:15px;height:15px;border:2px solid #aa4e41;border-radius:50%;margin-right:4px;vertical-align:-2px;transform:rotate(-12deg)}
  .pen-palette{margin-top:10px;padding:6px 9px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;width:fit-content}
  .pen-palette button{width:44px;height:44px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center}
  .pen-palette button span{width:28px;height:14px;background:var(--chip);display:block;border-radius:3px;border:1px solid #26352d44;transform:rotate(-6deg)}
  .pen-palette button:hover{border-color:#62764c}
  .drawing-status{margin:6px 0;color:var(--soft);font-size:14px}
  .pending-marker{display:flex;align-items:center;gap:10px;min-height:50px;margin-top:12px;padding:2px 10px 2px 13px;border:1px dashed #adb89a;border-radius:10px}
  .pending-marker button{margin-left:auto;min-height:40px}
  .week button.day{width:100%;display:flex;align-items:flex-start;justify-content:flex-start;border:0;border-right:1px solid var(--line);text-align:left;background:transparent;color:inherit;font:inherit;cursor:default;user-select:none}
  .week button.day:nth-child(7){border-right:0}
  .week button.overflow-day{background:#f6f5ee;color:#656c60}
  .day-num{display:grid;width:27px;height:27px;place-items:center;position:relative}
  .important .day-num::after{content:"";position:absolute;inset:-1px 0;border:2px solid #aa4e41;border-radius:51% 47% 49% 53%;transform:rotate(-11deg);pointer-events:none}
  .calendar.drawing .mark,.mark.pending{pointer-events:none}
  .calendar.drawing .week{touch-action:none}
  .calendar.drawing .day{cursor:crosshair}
  .calendar.drawing .day:hover .day-num{background:#dfe8cc;border-radius:50%}
  .mark.pending::before{opacity:.82}
  .trip-row{display:flex;gap:8px;align-items:stretch}
  .trip-row .trip{flex:1;min-width:0}
  .trip-row .share-button{flex:0 0 auto}
  .draft-panel{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);max-width:560px}
  .draft-panel h2{font-size:19px}
  .draft-panel form label{display:block;margin:12px 0 3px}
  .draft-panel input:not([type=hidden]){width:100%;font:inherit;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);padding:7px 10px}
  .draft-panel .save-draft{min-width:55px;font-size:23px}
  #drawn-dates{font-weight:650;font-variant-numeric:tabular-nums}
  @media(max-width:520px){.week button.day{font-size:13px;padding:4px}.day-num{width:25px;height:25px}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f8f6ee"></head><body><main><h1>我的旅行日历</h1>
    <form class="auth" id="account"><h2>登录旅行日历</h2>
      <label for="email">邮箱</label><input id="email" type="email" name="email" autocomplete="username" required>
      <label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" minlength="8" required>
      <div class="actions"><button type="submit" value="login">登录</button><button type="submit" value="register">注册</button></div>
    </form>
    <section class="calendar" aria-label="旅行月历" hidden>
      <header class="month"><button id="prev" type="button" aria-label="上个月">‹</button>
        <h2 id="month-label" aria-live="polite"></h2><button id="next" type="button" aria-label="下个月">›</button></header>
      <div class="weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
      <div id="weeks"></div>
    </section><div id="calendar-controls" hidden>
  <div class="drawing-tools" id="drawing-tools">
    <div class="tool-row">
      <button type="button" id="pen-tool" aria-expanded="false" aria-controls="pen-palette">✎ 马克笔</button>
      <button type="button" id="circle-tool" aria-pressed="false"><span class="tool-circle" aria-hidden="true"></span> 重要日期</button>
    </div>
    <div id="pen-palette" class="pen-palette" aria-label="选择马克笔颜色" hidden></div>
    <p id="drawing-status" class="drawing-status" role="status" hidden></p>
    <div id="pending-marker" class="pending-marker" hidden><span class="swatch" aria-hidden="true"></span><span id="pending-caption"></span>
      <button type="button" id="discard-marker">取消</button></div>
  </div>
    <section id="draft-panel" class="draft-panel" aria-labelledby="draft-heading" hidden>
      <h2 id="draft-heading">新行程</h2>
      <p id="drawn-dates"></p>
      <form id="new-trip">
        <input type="hidden" name="name"><input type="hidden" name="start_date"><input type="hidden" name="end_date"><input type="hidden" name="marker">
        <label for="trip-country">国家或地区</label>
        <input id="trip-country" role="combobox" aria-autocomplete="list" aria-controls="country-options" aria-expanded="false" autocomplete="off" placeholder="输入中文或英文搜索" required>
        <ul id="country-options" class="place-options" role="listbox" aria-label="国家或地区建议" hidden></ul>
        <label for="trip-city">城市</label>
        <input id="trip-city" role="combobox" aria-autocomplete="list" aria-controls="city-options" aria-expanded="false" autocomplete="off" placeholder="选城市，也可手动输入" maxlength="120" required readonly>
        <ul id="city-options" class="place-options" role="listbox" aria-label="城市建议" hidden></ul>
        <div class="actions"><button type="submit" class="save-draft" aria-label="保存行程">✓</button><button type="button" id="cancel-trip">取消</button></div>
        <p role="status"></p>
        <p class="attribution"><a href="https://www.geonames.org/export/" target="_blank" rel="noopener">地名数据来自 GeoNames</a></p>
      </form>
    </section><nav id="trips" class="trips" aria-label="本月旅行"></nav>
    <div class="actions account-actions">
      <label id="legacy-import-label" hidden>迁入旧行程<input id="legacy-import" type="file" accept=".json,application/json"></label>
      <button id="signout" type="button">退出</button>
    </div></div><p id="app-message" role="status"></p>
    <dialog id="share-dialog" aria-labelledby="share-heading" class="share-dialog">
      <div class="share-head"><h2 id="share-heading">分享行程</h2><button type="button" id="close-share">关闭</button></div>
      <p id="share-for"></p>
      <p class="share-scope">分享页显示日期和每日安排。票据、附件和备注保存在自己的账号里。</p>
      <form>
        <fieldset><legend>谁可以查看</legend>
          <label><input type="radio" name="access" value="account" checked>指定邮箱登录后查看</label>
          <label><input type="radio" name="access" value="link">拿到链接的人可以查看</label>
        </fieldset>
        <label class="share-recipient">获邀邮箱<input type="email" name="viewer" autocomplete="off" required></label>
        <div class="actions"><button type="submit">生成只读链接</button></div>
      </form>
      <div id="share-output" class="actions" hidden><input id="share-url" type="url" readonly aria-label="分享链接"><button type="button" id="copy-share">复制链接</button></div>
      <p role="status"></p>
      <h3>已生成的链接</h3><ul id="active-shares"></ul>
    </dialog></main><script type="module" src="./calendar-account.js"></script></body></html>
